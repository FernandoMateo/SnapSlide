# Nginx en el VPS: HTTPS, compresión y proxy hacia Next.js (puerto 3000) y PocketBase (puerto 8090).
# 1. Cambia snapslide.com por tu dominio y copia este archivo a /etc/nginx/sites-available/snapslide
# 2. ln -s /etc/nginx/sites-available/snapslide /etc/nginx/sites-enabled/ && nginx -t && systemctl reload nginx
# 3. certbot --nginx -d snapslide.com -d www.snapslide.com -d api.snapslide.com   (crea los certificados y las rutas 443)

# www → dominio principal (una sola URL canónica para SEO)
server {
  listen 80;
  server_name www.snapslide.com;
  return 301 https://snapslide.com$request_uri;
}

server {
  listen 80;
  server_name snapslide.com;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types text/plain text/css text/xml application/xml application/json application/javascript application/manifest+json image/svg+xml text/html;

  client_max_body_size 10m;

  # Archivos con hash de Next: caché de un año
  location /_next/static/ {
    proxy_pass http://127.0.0.1:3000;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
}

# PocketBase (cuando el frontend se conecte al backend): NEXT_PUBLIC_POCKETBASE_URL=https://api.snapslide.com
server {
  listen 80;
  server_name api.snapslide.com;
  client_max_body_size 20m;

  location / {
    proxy_pass http://127.0.0.1:8090;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Realtime (SSE) de PocketBase
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_read_timeout 360s;
  }
}
