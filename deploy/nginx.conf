# Nginx en el VPS (AlmaLinux): HTTPS, compresión y proxy hacia Next.js (puerto 3000).
# Ruta en el servidor: /etc/nginx/conf.d/snapslide.conf
#
# Certificado (Let's Encrypt, certbot instalado en /opt/certbot con venv de Python):
#   sudo certbot certonly --webroot -w /var/www/letsencrypt -d snap-slide.com -d www.snap-slide.com
# Renovación automática: timer systemd "certbot-renew.timer" (2 veces al día, recarga nginx).
#
# DNS en GoDaddy: A @ → 208.109.245.55 · CNAME www → snap-slide.com

# HTTP (dominio, www y la IP) → HTTPS en el dominio principal
server {
  listen 80 default_server;
  listen [::]:80 default_server;
  server_name snap-slide.com www.snap-slide.com _;

  # Validación de Let's Encrypt al renovar
  location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }

  location / { return 301 https://snap-slide.com$request_uri; }
}

# www → dominio principal (una sola URL canónica para SEO)
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name www.snap-slide.com;

  ssl_certificate     /etc/letsencrypt/live/snap-slide.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/snap-slide.com/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;

  return 301 https://snap-slide.com$request_uri;
}

server {
  listen 443 ssl default_server;
  listen [::]:443 ssl default_server;
  http2 on;
  server_name snap-slide.com;

  ssl_certificate     /etc/letsencrypt/live/snap-slide.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/snap-slide.com/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;

  add_header Strict-Transport-Security "max-age=31536000" always;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_vary on;
  gzip_types text/plain text/css text/xml application/xml application/json application/javascript application/manifest+json image/svg+xml;

  client_max_body_size 10m;

  # Archivos con hash de Next: caché de un año
  location /_next/static/ {
    proxy_pass http://127.0.0.1:3000;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
}
